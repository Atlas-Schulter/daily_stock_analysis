name: LLM Evaluation Live
on:
  workflow_dispatch:
    inputs:
      models:
        description: 'Comma-separated LiteLLM model IDs, e.g. openai/... , gemini/...'
        required: true
        type: string
      confirm_paid_calls:
        description: 'I authorize up to six real paid model requests'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  evaluate:
    if: ${{ inputs.confirm_paid_calls == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Test benchmark harness
        run: python -m unittest discover -s tests -p 'test_llm_eval_live.py' -v
      - name: Install LiteLLM
        run: python -m pip install 'litellm>=1.0,<2'
      - name: Execute real model calls
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AIHUBMIX_API_KEY: ${{ secrets.AIHUBMIX_API_KEY }}
          BENCHMARK_MODELS: ${{ inputs.models }}
        run: |
          python -m src.llm_eval_live --models "$BENCHMARK_MODELS" --confirm-live --max-calls 6
      - name: Score results
        if: always()
        run: |
          if [ -s artifacts/live_benchmark/reports.jsonl ]; then
            python -m src.llm_eval_benchmark --fixtures benchmarks/fixtures/market_cases.json --reports artifacts/live_benchmark/reports.jsonl --usage artifacts/live_benchmark/usage.jsonl --output artifacts/live_benchmark/score.json
          else
            echo 'No successful reports to score'
          fi
      - name: Upload benchmark data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-live-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/live_benchmark/
          retention-days: 14
          if-no-files-found: warn

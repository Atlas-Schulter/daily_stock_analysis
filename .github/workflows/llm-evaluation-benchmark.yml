name: LLM Evaluation Benchmark
on:
  push:
    paths:
      - 'src/llm_eval_benchmark.py'
      - 'src/llmops_metrics.py'
      - 'tests/test_llm_eval_benchmark.py'
      - 'benchmarks/**'
      - '.github/workflows/llm-evaluation-benchmark.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Run benchmark unit tests
        run: python -m unittest discover -s tests -p 'test_llm_eval_benchmark.py' -v
      - name: Run offline benchmark
        run: python -m src.llm_eval_benchmark
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/llm_benchmark.json
          retention-days: 30
          if-no-files-found: warn

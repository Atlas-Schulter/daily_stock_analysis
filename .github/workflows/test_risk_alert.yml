
name: Test Risk Alert

on:
  push:
    paths:
      - 'src/risk_alert.py'
      - 'tests/test_risk_alert.py'
      - '.github/workflows/test_risk_alert.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run risk alert tests
        run: python -m unittest discover -s tests -p "test_risk_alert.py" -v



name: Test Risk Alert

on:
  push:
    paths:
      - 'src/risk_alert.py'
      - 'tests/test_risk_alert.py'
      - 'tests/test_risk_integration.py'
      - '.github/workflows/test_risk_alert.yml'

  schedule:
    - cron: '0 23 * * 1-5'

  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode'
        required: true
        type: choice
        default: analyze
        options:
          - analyze
          - webhook-test
      send_discord:
        description: 'Enable Discord notifications'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install yfinance

      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -p "test_risk_*.py" -v

      - name: Run stock risk analysis
        env:
          RISK_DROP_THRESHOLD: '5.0'
          STOCK_CODES: 'NVDA,AAPL,TSLA'
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SEND_DISCORD: ${{ github.event_name == 'workflow_dispatch' && inputs.send_discord || false }}
          WEBHOOK_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'webhook-test' }}
        run: python src/risk_alert.py

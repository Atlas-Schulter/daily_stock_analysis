name: Test Risk Alert

on:
  push:
    paths:
      - 'src/risk_alert.py'
      - 'src/alert_state.py'
      - 'src/observability.py'
      - 'tests/test_risk_alert.py'
      - 'tests/test_risk_integration.py'
      - 'tests/test_risk_state.py'
      - 'tests/test_observability.py'
      - '.github/workflows/test_risk_alert.yml'


  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode'
        type: choice
        default: analyze
        options:
          - analyze
          - webhook-test
      send_discord:
        description: 'Enable Discord notifications'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-stock-risk-alert
  cancel-in-progress: false

jobs:
  unit-tests:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Run isolated unit and integration tests
        run: |
          python -m unittest discover -s tests -p 'test_risk_*.py' -v
          python -m unittest discover -s tests -p 'test_observability.py' -v

  analyze:
    needs: [unit-tests]
    if: >-
      always() && (
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && needs.unit-tests.result == 'success')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install market data dependency
        run: python -m pip install yfinance
      - name: Restore alert history cache
        uses: actions/cache/restore@v4
        with:
          path: .state/alert_state.json
          key: stock-risk-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            stock-risk-history-
      - name: Run risk analysis
        env:
          RISK_DROP_THRESHOLD: '5.0'
          STOCK_CODES: 'NVDA,AAPL,TSLA'
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SEND_DISCORD: ${{ github.event_name == 'schedule' || inputs.send_discord == true }}
          WEBHOOK_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'webhook-test' }}
        run: python src/risk_alert.py
      - name: Upload run metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risk-metrics-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/risk_metrics.json
          if-no-files-found: warn
          retention-days: 30
      - name: Save alert history cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state/alert_state.json
          key: stock-risk-history-${{ github.run_id }}-${{ github.run_attempt }}

  failure-notification:
    needs: [analyze]
    if: always() && needs.analyze.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Notify Discord on analysis failure
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python src/observability.py

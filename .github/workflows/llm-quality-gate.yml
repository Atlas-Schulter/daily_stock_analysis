name: LLM Quality Gate

# 触发入口：匹配文件的 push 只执行离线测试；手动运行且勾选 run_live 才发起真实模型请求。
on:
  push:
    paths:
      - 'benchmarks/quality_gate.py'
      - 'benchmarks/live_v2.py'
      - 'benchmarks/evaluate_v2.py'
      - 'benchmarks/fixtures/**'
      - 'src/llmops_pricing.py'
      - 'tests/test_quality_gate.py'
      - 'tests/test_live*.py'
      - 'tests/test_benchmark_v2.py'
      - 'config/llm_pricing.json'
      - '.github/workflows/benchmark-live-v2.yml'
      - '.github/workflows/llm-quality-gate.yml'
  workflow_dispatch:
    inputs:
      run_live:
        description: 'Call paid model APIs (requires configured API key)'
        type: boolean
        default: false
      models:
        description: 'Comma-separated LiteLLM model IDs'
        type: string
        default: 'gemini/gemini-2.5-flash'
      sample_limit:
        description: 'Cases per model (recommend 1-2 initially)'
        type: number
        default: 2

# 只授予读取仓库权限；API Key 通过 GitHub Secrets 注入，文件中不保存密钥值。
permissions:
  contents: read

jobs:
  # 第一阶段：不联网调用模型，验证 runner、评分逻辑和失败处理。
  offline-quality-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Test gate including negative cases
        run: |
          python -m unittest discover -s tests -p 'test_live*.py' -v
          python -m unittest discover -s tests -p 'test_benchmark_v2.py' -v
          python -m unittest discover -s tests -p 'test_quality_gate.py' -v

  # 第二阶段依赖离线测试成功；单独运行这条 Workflow 不会自动阻止其他发布 Workflow。
  live-quality-gate:
    needs: offline-quality-tests
    if: github.event_name == 'workflow_dispatch' && inputs.run_live == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install LiteLLM
        run: python -m pip install 'litellm>=1.0,<2'
      # 执行真实调用并保存报告、用量和错误。runner 正常退出不等于报告通过质量检查。
      - name: Run real benchmark
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AIHUBMIX_API_KEY: ${{ secrets.AIHUBMIX_API_KEY }}
          BENCHMARK_MODELS: ${{ inputs.models }}
          SAMPLE_LIMIT: ${{ inputs.sample_limit }}
          LLM_BENCHMARK_DELAY_SECONDS: '5'
        run: |
          python -m benchmarks.live_v2 \
            --models "$BENCHMARK_MODELS" \
            --sample-limit "$SAMPLE_LIMIT" \
            --max-calls 6 \
            --confirm-live
      # 必须有这一步：100% 案例满足字段/事实要求且无错误，退出码才为 0。
      - name: Enforce quality gate
        env:
          SAMPLE_LIMIT: ${{ inputs.sample_limit }}
        run: python -m benchmarks.quality_gate --min-pass-rate 1.0 --sample-limit "$SAMPLE_LIMIT"
      # always() 仅用于保留排错证据，即使 Gate 失败也上传；不会把失败结果改成成功。
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-quality-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/live_v2/
          retention-days: 14
          if-no-files-found: warn

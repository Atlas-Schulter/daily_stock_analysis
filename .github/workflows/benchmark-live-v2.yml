name: Live Benchmark V2 (20 Cases)

# 手动模型对比入口；sample_limit 是每模型案例数，max_calls 是所有模型合计的调用上限。
on:
  workflow_dispatch:
    inputs:
      models:
        description: 'Comma-separated models, e.g. aihubmix/deepseek-v4.1-flash'
        required: true
        default: 'aihubmix/deepseek-v4.1-flash'
        type: string
      sample_limit:
        description: 'Cases per model (20 for full suite)'
        required: true
        default: '20'
        type: choice
        options: ['1', '5', '10', '20']
      max_calls:
        description: 'Maximum total calls (must cover cases x models)'
        required: true
        default: '20'
        type: choice
        options: ['1', '5', '10', '20', '40', '60']
      confirm_live:
        description: 'I understand real API usage can incur costs'
        required: true
        type: boolean
        default: false

# 读取仓库即可；此 Workflow 不推送代码、不发布镜像。
permissions:
  contents: read

jobs:
  # 只有明确勾选 confirm_live 才执行，避免误触付费调用。
  live-benchmark-v2:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_live == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install LiteLLM
        run: python -m pip install 'litellm>=1,<2'
      # 先运行离线回归测试，提前发现代码问题，不消耗模型 API 额度。
      - name: Run offline evaluator and live-runner tests
        run: |
          python -m unittest discover -s tests -p 'test_live*.py' -v
          python -m unittest discover -s tests -p 'test_benchmark_v2.py' -v
          python -m unittest discover -s tests -p 'test_quality_gate.py' -v
      # 使用同一个 live_v2 runner；输入通过环境变量传入命令，模型密钥从 Secrets 读取。
      - name: Execute model comparison
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AIHUBMIX_API_KEY: ${{ secrets.AIHUBMIX_API_KEY }}
          MODELS: ${{ inputs.models }}
          SAMPLE_LIMIT: ${{ inputs.sample_limit }}
          MAX_CALLS: ${{ inputs.max_calls }}
        run: |
          python -m benchmarks.live_v2 \
            --models "$MODELS" \
            --sample-limit "$SAMPLE_LIMIT" \
            --max-calls "$MAX_CALLS" \
            --confirm-live
      # 即使部分模型失败也保存产物。绿色仅表示流程执行完，质量分数要看比较报告或另外运行 Gate。
      - name: Upload results even after partial failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-benchmark-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/live_v2/
          if-no-files-found: warn
          retention-days: 14


name: Test AIHubMix Connection

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'AIHubMix Model ID'
        required: true
        default: 'gpt-4o-mini'
        type: string

permissions:
  contents: read

jobs:
  test-aihubmix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install LiteLLM
        run: python -m pip install litellm

      - name: Test model connection
        env:
          AIHUBMIX_API_KEY: ${{ secrets.AIHUBMIX_API_KEY }}
          MODEL_ID: ${{ inputs.model }}
        run: |
          python - <<'PY'
          import os
          import litellm

          response = litellm.completion(
              model=f"openai/{os.environ['MODEL_ID']}",
              api_base="https://aihubmix.com/v1",
              api_key=os.environ["AIHUBMIX_API_KEY"],
              messages=[
                  {
                      "role": "user",
                      "content": "Reply with exactly: OK"
                  }
              ],
              max_tokens=32,
              stream=False,
              num_retries=0,
          )

          print("Model:", os.environ["MODEL_ID"])
          print("Response:", response.choices[0].message.content)
          print("Usage:", response.usage)
          PY

name: Docker Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag in semver format, e.g. v3.0.6'
        required: true
        type: string

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 手动输入 tag 与事件 tag 统一解析为不可变 SHA，随后 Gate 和构建都使用它。
  resolve-source:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Resolve annotated release tag once
        id: resolve
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          RELEASE_TAG="${REQUESTED_TAG:-$GITHUB_REF_NAME}"
          # Validate the release tag format.
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          
          # Restore the annotated tag object from the remote repository.
          # Checkout on a tag-triggered workflow may locally replace the tag ref
          # with the commit SHA, causing the tag type check to fail.
          git fetch --force origin \
            "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          
          # Require an annotated tag, not a lightweight tag.
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          SOURCE_SHA="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  # 真实质量检查必须通过；models 可由 Repository Variable 覆盖。
  llm-quality:
    needs: resolve-source
    uses: ./.github/workflows/llm-release-gate.yml
    with:
      source_sha: ${{ needs.resolve-source.outputs.sha }}
      models: ${{ vars.RELEASE_LLM_MODELS || 'gemini/gemini-2.5-flash' }}
    secrets: inherit

  # needs 形成发布门禁：任一前置 job 失败或取消，本 job 默认跳过。
  build-and-push:
    needs: [resolve-source, llm-quality]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend gate dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      # 继续保留原有后端检查，LLM Gate 不能替代代码与构建验证。
      - name: Run backend gate before publish
        run: ./scripts/ci_gate.sh

      - name: Validate source and release docs
        env:
          SOURCE_SHA: ${{ needs.resolve-source.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -f README.md

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{ is_default_branch }}
            type=ref,event=tag
            type=raw,value=${{ inputs.release_tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=sha-${{ needs.resolve-source.outputs.sha }}

      # 本地镜像 smoke 通过后才会执行下面的 registry push。
      - name: Pre-publish docker smoke
        run: |
          docker build -t stock-analysis:release -f docker/Dockerfile .
          docker run --rm stock-analysis:release python -c "
          from src.config import get_config; print('ok-config')
          from src.storage import DatabaseManager; print('ok-storage')
          from src.notification import NotificationService; print('ok-notification')
          from data_provider import DataFetcherManager; print('ok-data-provider')
          from src.analyzer import GeminiAnalyzer; print('ok-analyzer')
          print('release-smoke-ok')
          "

      # Build and publish the validated application image.
      - name: Publish Docker image to GHCR
        id: publish
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      # Verify the exact published image, not a locally rebuilt image.
      - name: Verify published GHCR image
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
      
          # Pin the published image to its immutable digest.
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}@${IMAGE_DIGEST}"
      
          # Download the exact image that was just published.
          docker pull "$IMAGE"
      
          # Verify that essential application modules can be imported.
          # Override the scheduled-task entrypoint to avoid real API calls.
          docker run --rm --entrypoint python "$IMAGE" -c "
          from src.config import get_config
          from src.storage import DatabaseManager
          from src.analyzer import GeminiAnalyzer
          from src.notification import NotificationService
          print('Post-release verification passed')
          "
      
          # Record the verified image reference in GitHub Actions.
          echo "Verified image: $IMAGE" >> "$GITHUB_STEP_SUMMARY"
